[package]
name = "yinji"
version = "0.1.0"
description = "印迹 · 把日子，长成底气"
edition = "2021"

[lib]
name = "yinji_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde_json = "1"
