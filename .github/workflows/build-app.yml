name: Build Yinji Demo App

# 示例版：页面里所有个人信息均为虚构，不含任何真实个人资料。
# 前端明文入库，构建产物直接公开上传 Release；不再需要一次性密钥 / 隧道交接。
on:
  push:
    branches: [main]
    paths:
      - 'app/.rebuild'
      - 'app/src/index.html'
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG: v0.1.5
  EXE_ASSET: yinji-demo-v0.1.5.exe
  APK_ASSET: yinji-demo-v0.1.5.apk

jobs:
  prepare:
    name: Clean legacy assets and ensure release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure release exists and drop private / legacy assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "印迹 v0.1.5 · 示例版" \
              --notes "全虚构示例数据，不含任何真实个人信息"
          for n in "_0.1.0_x64-setup.exe" "app-universal-debug.apk" \
                   "yinji-public-v0.1.0.zip" "yinji-full-v0.1.0.exe.enc" \
                   "yinji-full-v0.1.0.apk.enc" "yinji-orig-v0.1.0.exe.enc" \
                   "yinji-orig-v0.1.0.apk.enc" "yinji-orig-v0.1.0.exe" \
                   "yinji-orig-v0.1.0.apk"; do
            if gh release delete-asset "$TAG" "$n" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null; then
              echo "deleted legacy $n"
            fi
          done

  windows:
    name: Demo Windows installer
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify the fictional demo page (SHA-256 pinned)
        shell: bash
        run: |
          set -eu
          test "$(wc -c < app/src/index.html)" -gt 500000
          node -e "const c=require('crypto'),f=require('fs');const s=f.readFileSync('app/src/index.html','utf8').split(String.fromCharCode(13)).join('');const h=c.createHash('sha256').update(s,'utf8').digest('hex');if(h!=='ae8b229eb1a1761a31700c577966d0df465b00218869957719625f9fcd5f6e4e'){console.error('demo page hash mismatch',h);process.exit(1)}console.log('demo page verified',h)"
          grep -q '林知远' app/src/index.html
          echo "demo page OK: $(wc -c < app/src/index.html) bytes"
      - name: Generate app icons
        working-directory: app/src-tauri
        run: npx --yes @tauri-apps/cli@latest icon ../src/icon.svg
      - name: Build Tauri (Windows NSIS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
      - name: Upload EXE to public Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          EXE=$(find app/src-tauri/target/release/bundle/nsis -name '*.exe' -type f | head -1)
          test -n "$EXE"
          cp "$EXE" "$EXE_ASSET"
          gh release upload "$TAG" "$EXE_ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          echo "uploaded $EXE_ASSET ($(wc -c < "$EXE_ASSET") bytes)"

  android:
    name: Demo Android APK (arm64)
    needs: prepare
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - name: Accept licenses and install NDK
        run: |
          SDKMANAGER=$(find $ANDROID_SDK_ROOT/cmdline-tools -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | $SDKMANAGER --licenses || true
            $SDKMANAGER "ndk;25.2.9519653" || true
          fi
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"
      - name: Verify the fictional demo page (SHA-256 pinned)
        run: |
          set -eu
          test "$(wc -c < app/src/index.html)" -gt 500000
          node -e "const c=require('crypto'),f=require('fs');const s=f.readFileSync('app/src/index.html','utf8').split(String.fromCharCode(13)).join('');const h=c.createHash('sha256').update(s,'utf8').digest('hex');if(h!=='ae8b229eb1a1761a31700c577966d0df465b00218869957719625f9fcd5f6e4e'){console.error('demo page hash mismatch',h);process.exit(1)}console.log('demo page verified',h)"
          grep -q '林知远' app/src/index.html
      - name: Generate app icons
        working-directory: app/src-tauri
        run: npx --yes @tauri-apps/cli@latest icon ../src/icon.svg
      - name: Init Android project
        working-directory: app/src-tauri
        run: cargo tauri android init
      - name: Apply brand icons
        working-directory: app/src-tauri
        run: |
          set -eu
          SRC=icons/android
          DSTDIR=gen/android/app/src/main/res
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for f in ic_launcher.png ic_launcher_foreground.png ic_launcher_round.png; do
              if [ -f "$SRC/mipmap-$d/$f" ] && [ -f "$DSTDIR/mipmap-$d/$f" ]; then
                cp -f "$SRC/mipmap-$d/$f" "$DSTDIR/mipmap-$d/$f"
              fi
            done
          done
      - name: Build APK
        working-directory: app/src-tauri
        run: cargo tauri android build --debug --apk --target aarch64
      - name: Re-sign APK with fixed key
        working-directory: app/src-tauri
        env:
          KS_PASS: yinji-android-2026
        run: |
          set -eu
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          [ -n "$BT" ] || { echo "::error::no android build-tools"; exit 1; }
          for APK in $(find gen/android/app/build/outputs/apk -type f -name '*.apk'); do
            "$BT/zipalign" -f -p 4 "$APK" /tmp/yj-aligned.apk
            "$BT/apksigner" sign --ks signing/yinji-android.p12 --ks-type PKCS12 \
              --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" \
              --out /tmp/yj-signed.apk /tmp/yj-aligned.apk
            "$BT/apksigner" verify /tmp/yj-signed.apk
            cp /tmp/yj-signed.apk "$APK"
            rm -f /tmp/yj-aligned.apk /tmp/yj-signed.apk
          done
      - name: Upload APK to public Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          APK=$(find app/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -type f | head -1)
          test -n "$APK"
          cp "$APK" "$APK_ASSET"
          gh release upload "$TAG" "$APK_ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          echo "uploaded $APK_ASSET ($(wc -c < "$APK_ASSET") bytes)"
