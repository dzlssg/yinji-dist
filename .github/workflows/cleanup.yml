name: Purge Encrypted Hand-off Assets

# 本机取回完整版安装包后，清掉公开 Release 里临时存放的 .enc 密文资产。
# 由 push .cleanup 触发；CI 自带的 GITHUB_TOKEN 有 contents: write 权限。
on:
  push:
    branches: [main]
    paths:
      - '.cleanup'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Delete encrypted assets from public release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v0.1.0
        run: |
          set -eu
          ids=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq '.assets[] | select(.name | endswith(".enc")) | .id')
          if [ -z "$ids" ]; then
            echo "no encrypted assets left"
          else
            for id in $ids; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id" >/dev/null || true
              echo "deleted asset $id"
            done
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name'
